# SwiftLint — base from ios-project-conventions + project rules
included:
  - BlixRekrtuacja
  - BlixRekrtuacjaTests
excluded:
  - DerivedData
  - .build

opt_in_rules:
  # Safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unhandled_throwing_task
  - identical_operands
  - yoda_condition
  - discouraged_optional_boolean
  - unowned_variable_capture
  - self_binding
  - return_value_from_void_function
  # Idiomatic, shorter code
  - empty_count
  - empty_string
  - empty_collection_literal
  - first_where
  - last_where
  - contains_over_first_not_nil
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_range_nil_comparison
  - sorted_first_last
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - direct_return
  - superfluous_else
  - shorthand_optional_binding
  - prefer_key_path
  - prefer_zero_over_explicit_init
  - toggle_bool
  - explicit_init
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  # SwiftUI & architecture
  - private_swiftui_state
  - convenience_type
  - strict_fileprivate
  - prefer_self_type_over_type_of_self
  - prefer_self_in_static_references
  - legacy_objc_type
  # Formatting
  - sorted_imports
  - modifier_order
  - closure_spacing
  - closure_end_indentation
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - number_separator
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 160
function_body_length:
  warning: 20
  error: 40
type_body_length:
  warning: 200
  error: 300
file_length:
  warning: 300
  error: 400
cyclomatic_complexity:
  warning: 8
  error: 12
nesting:
  type_level: 2
identifier_name:
  excluded: [id, x, y]
sorted_imports:
  grouping: attributes

reporter: xcode

custom_rules:
  # App
  no_print:
    regex: '\bprint\('
    match_kinds: identifier
    message: "Use Logger instead of print"
    severity: error
  no_text_literals:
    excluded: '/BlixRekrtuacjaTests/'
    regex: '\b(Text|Button|Label|Toggle|navigationTitle|alert|confirmationDialog)\(\s*"|\b(title|message|value|text):\s*"'
    message: "User-facing text must come from Localizable.xcstrings via generated symbols"
    severity: error
  no_raw_colors:
    excluded: '/(BlixRekrtuacjaTests|Tokens)/'
    regex: '\.(red|green|blue|black|white|gray|orange|yellow|pink|purple|mint|teal|cyan|indigo|brown)\b|Color\((red|white):'
    message: "Use color tokens from Assets.xcassets/Colors"
    severity: error
  no_magic_numbers:
    excluded: '/(BlixRekrtuacjaTests|Tokens)/'
    regex: '(\.padding\(\s*(\.\w+\s*,\s*)?|spacing:\s*|cornerRadius:\s*|(min|max)?([Ww]idth|[Hh]eight):\s*|size:\s*)\d'
    message: "Use Spacing / Radius / Size tokens and Typography"
    severity: error
  no_observable_object:
    regex: '\bObservableObject\b|@(Published|StateObject|ObservedObject|EnvironmentObject)\b'
    message: "Use @Observable (Observation) instead of ObservableObject"
    severity: error
  no_raw_sf_symbols:
    excluded: '/Resources/SFSymbol\.swift$'
    regex: '\bsystemName:|\bsystemImage:\s*"'
    message: "Declare SF Symbols in Resources/SFSymbol.swift and use SFSymbol.x.image"
    severity: error
  no_dispatch_queue:
    regex: '\bDispatchQueue\b'
    message: "Use async/await, Task or actors instead of DispatchQueue"
    severity: error
  # Tests
  no_xctest_assertions:
    included: '/BlixRekrtuacjaTests/'
    regex: '\bXCT(Assert\w*|Fail|Unwrap)\b'
    message: "Use Swift Testing: #expect / #require"
    severity: error
  no_sleep_in_tests:
    included: '/BlixRekrtuacjaTests/'
    regex: '\b(u?sleep\(|Task\.sleep)'
    message: "Tests must be deterministic — no sleeping"
    severity: error
